<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Game - eigur</title>
    <style>
        body {
            font-family: 'Verdana', 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: #111;
            border: 3px solid #444;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .road {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #333;
        }
        
        .road-line {
            position: absolute;
            width: 10px;
            height: 30px;
            background: yellow;
            left: 50%;
            margin-left: -5px;
        }
        
        .player-car {
            position: absolute;
            width: 40px;
            height: 70px;
            bottom: 50px;
            border-radius: 5px;
            z-index: 10;
            /* Realistic car shape */
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
            border: 2px solid #7a1919;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }
        
        .player-car::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            height: 20px;
            background: rgba(173, 216, 230, 0.7);
            border-radius: 3px;
        }
        
        .player-car::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
        }
        
        .player-car::before {
            content: '';
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
        }
        
        .enemy-car {
            position: absolute;
            width: 40px;
            height: 70px;
            border-radius: 5px;
        }
        
        .enemy-car.car-blue {
            /* Realistic blue car */
            background: linear-gradient(to bottom, #3498db, #2980b9);
            border: 2px solid #1a5276;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }
        
        .enemy-car.car-blue::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            height: 20px;
            background: rgba(173, 216, 230, 0.7);
            border-radius: 3px;
        }
        
        .enemy-car.car-blue::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
        }
        
        .enemy-car.car-blue::before {
            content: '';
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
        }
        
        .enemy-car.car-green {
            /* Realistic green car */
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            border: 2px solid #1e8449;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }
        
        .enemy-car.car-green::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            height: 20px;
            background: rgba(173, 216, 230, 0.7);
            border-radius: 3px;
        }
        
        .enemy-car.car-green::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
        }
        
        .enemy-car.car-green::before {
            content: '';
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
        }
        
        .enemy-car.car-yellow {
            /* Realistic yellow car */
            background: linear-gradient(to bottom, #f1c40f, #f39c12);
            border: 2px solid #d35400;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }
        
        .enemy-car.car-yellow::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            height: 20px;
            background: rgba(173, 216, 230, 0.7);
            border-radius: 3px;
        }
        
        .enemy-car.car-yellow::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
        }
        
        .enemy-car.car-yellow::before {
            content: '';
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
        }
        
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .score {
            font-size: 1.2rem;
            margin-top: 10px;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <h1>🏎️ eigurRacer</h1>
    <div class="game-container" id="gameContainer">
        <div class="road" id="road"></div>
        <div class="player-car" id="playerCar"></div>
        <div class="game-over" id="gameOver">
            <h2>Game Over!</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button onclick="initGame()">Play Again</button>
        </div>
    </div>
    
    <div class="controls">
        <button onclick="startGame()" id="startBtn">Start Game</button>
        <button onclick="resetGame()">Reset</button>
    </div>
    
    <div class="score">
        Score: <span id="score">0</span>
    </div>

    <script>
        class RacingGame {
            constructor() {
                this.gameContainer = document.getElementById('gameContainer');
                this.playerCar = document.getElementById('playerCar');
                this.road = document.getElementById('road');
                this.scoreDisplay = document.getElementById('score');
                this.finalScoreDisplay = document.getElementById('finalScore');
                this.gameOverScreen = document.getElementById('gameOver');
                this.startBtn = document.getElementById('startBtn');
                
                this.gameWidth = 400;
                this.gameHeight = 600;
                this.playerPosition = this.gameWidth / 2 - 20;
                this.enemies = [];
                this.roadLines = [];
                this.score = 0;
                this.gameSpeed = 2;
                this.gameRunning = false;
                this.animationId = null;
                
                this.keys = {};
                
                this.init();
            }
            
            init() {
                this.createRoadLines();
                this.positionPlayerCar();
                this.bindEvents();
            }
            
            createRoadLines() {
                for (let i = 0; i < 10; i++) {
                    const line = document.createElement('div');
                    line.className = 'road-line';
                    line.style.top = (i * 100 - 50) + 'px';
                    this.road.appendChild(line);
                    this.roadLines.push(line);
                }
            }
            
            positionPlayerCar() {
                this.playerCar.style.left = this.playerPosition + 'px';
            }
            
            bindEvents() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                });
                
                document.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                });
                
                // Touch controls for mobile
                this.gameContainer.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const rect = this.gameContainer.getBoundingClientRect();
                    const x = touch.clientX - rect.left;
                    
                    if (x < this.gameWidth / 2) {
                        this.playerPosition -= 50;
                    } else {
                        this.playerPosition += 50;
                    }
                    
                    this.playerPosition = Math.max(0, Math.min(this.gameWidth - 40, this.playerPosition));
                    this.playerCar.style.left = this.playerPosition + 'px';
                });
            }
            
            start() {
                if (this.gameRunning) return;
                
                this.gameRunning = true;
                this.gameOverScreen.style.display = 'none';
                this.gameLoop();
            }
            
            gameLoop() {
                if (!this.gameRunning) return;
                
                this.moveRoadLines();
                this.moveEnemies();
                this.spawnEnemy();
                this.checkCollisions();
                this.updateControls();
                this.updateScore();
                
                this.animationId = requestAnimationFrame(() => this.gameLoop());
            }
            
            moveRoadLines() {
                this.roadLines.forEach(line => {
                    const currentTop = parseInt(line.style.top);
                    let newTop = currentTop + this.gameSpeed;
                    
                    if (newTop > this.gameHeight) {
                        newTop = -30;
                    }
                    
                    line.style.top = newTop + 'px';
                });
            }
            
            spawnEnemy() {
                if (Math.random() < 0.02) {
                    const enemy = document.createElement('div');
                    enemy.className = 'enemy-car';
                    
                    // Randomly assign car type for variety
                    const carTypes = ['car-blue', 'car-green', 'car-yellow'];
                    const randomType = carTypes[Math.floor(Math.random() * carTypes.length)];
                    enemy.classList.add(randomType);
                    
                    const lane = Math.floor(Math.random() * 3); // 3 lanes
                    const laneWidth = this.gameWidth / 3;
                    enemy.style.left = (lane * laneWidth + laneWidth / 2 - 20) + 'px';
                    enemy.style.top = '-70px';
                    this.gameContainer.appendChild(enemy);
                    this.enemies.push(enemy);
                }
            }
            
            moveEnemies() {
                this.enemies.forEach((enemy, index) => {
                    const currentTop = parseInt(enemy.style.top);
                    let newTop = currentTop + this.gameSpeed + 1;
                    
                    if (newTop > this.gameHeight) {
                        enemy.remove();
                        this.enemies.splice(index, 1);
                        this.score += 10;
                    } else {
                        enemy.style.top = newTop + 'px';
                    }
                });
            }
            
            updateControls() {
                if (this.keys['ArrowLeft'] || this.keys['a']) {
                    this.playerPosition -= 5;
                }
                
                if (this.keys['ArrowRight'] || this.keys['d']) {
                    this.playerPosition += 5;
                }
                
                this.playerPosition = Math.max(0, Math.min(this.gameWidth - 40, this.playerPosition));
                this.playerCar.style.left = this.playerPosition + 'px';
            }
            
            checkCollisions() {
                const playerRect = this.playerCar.getBoundingClientRect();
                
                for (let enemy of this.enemies) {
                    const enemyRect = enemy.getBoundingClientRect();
                    
                    if (
                        playerRect.left < enemyRect.right &&
                        playerRect.right > enemyRect.left &&
                        playerRect.top < enemyRect.bottom &&
                        playerRect.bottom > enemyRect.top
                    ) {
                        this.endGame();
                        return;
                    }
                }
            }
            
            updateScore() {
                this.score += 0.1;
                this.scoreDisplay.textContent = Math.floor(this.score);
            }
            
            endGame() {
                this.gameRunning = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                
                this.finalScoreDisplay.textContent = Math.floor(this.score);
                this.gameOverScreen.style.display = 'block';
            }
            
            reset() {
                this.enemies.forEach(enemy => enemy.remove());
                this.enemies = [];
                this.score = 0;
                this.scoreDisplay.textContent = '0';
                this.playerPosition = this.gameWidth / 2 - 20;
                this.positionPlayerCar();
                
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                
                this.gameRunning = false;
            }
        }
        
        let game;
        
        function initGame() {
            game = new RacingGame();
        }
        
        function startGame() {
            if (!game) {
                initGame();
            }
            game.start();
        }
        
        function resetGame() {
            if (game) {
                game.reset();
            }
        }
        
        // Initialize the game
        window.onload = initGame;
    </script>
</body>
</html>
