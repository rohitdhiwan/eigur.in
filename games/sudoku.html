<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku - eigur</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            font-family: 'Verdana', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: white;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 1px;
            margin: 20px auto;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .cell:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .cell.fixed {
            background: rgba(255, 255, 255, 0.4);
            color: #333;
        }
        
        .cell.selected {
            background: rgba(255, 215, 0, 0.4);
        }
        
        .cell.error {
            background: rgba(231, 76, 60, 0.4);
        }
        
        .controls {
            margin: 20px 0;
        }
        
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .number-pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 300px;
        }
        
        .number-btn {
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .difficulty {
            margin: 15px 0;
        }
        
        select {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            margin-left: 10px;
        }
        
        option {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🧩 Sudoku eigur</h1>
        
        <div class="difficulty">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>
        
        <div class="board" id="board"></div>
        
        <div class="number-pad">
            <button class="number-btn" onclick="inputNumber(1)">1</button>
            <button class="number-btn" onclick="inputNumber(2)">2</button>
            <button class="number-btn" onclick="inputNumber(3)">3</button>
            <button class="number-btn" onclick="inputNumber(4)">4</button>
            <button class="number-btn" onclick="inputNumber(5)">5</button>
            <button class="number-btn" onclick="inputNumber(6)">6</button>
            <button class="number-btn" onclick="inputNumber(7)">7</button>
            <button class="number-btn" onclick="inputNumber(8)">8</button>
            <button class="number-btn" onclick="inputNumber(9)">9</button>
            <button class="number-btn" onclick="inputNumber(0)">Clear</button>
        </div>
        
        <div class="controls">
            <button onclick="checkSolution()">Check Solution</button>
            <button onclick="newGame()">New Game</button>
            <button onclick="solvePuzzle()">Solve</button>
        </div>
    </div>

    <script>
        class SudokuGame {
            constructor() {
                this.board = Array(9).fill().map(() => Array(9).fill(0));
                this.solution = Array(9).fill().map(() => Array(9).fill(0));
                this.initialBoard = Array(9).fill().map(() => Array(9).fill(0));
                this.selectedCell = null;
                
                this.cells = [];
                this.difficulty = 'medium';
                
                this.init();
            }
            
            init() {
                this.createBoard();
                this.newGame();
            }
            
            createBoard() {
                const boardElement = document.getElementById('board');
                boardElement.innerHTML = '';
                
                for (let row = 0; row < 9; row++) {
                    for (let col = 0; col < 9; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        
                        // Add thicker borders for 3x3 boxes
                        if (row % 3 === 0) cell.style.borderTop = '2px solid rgba(255,255,255,0.5)';
                        if (row === 8) cell.style.borderBottom = '2px solid rgba(255,255,255,0.5)';
                        if (col % 3 === 0) cell.style.borderLeft = '2px solid rgba(255,255,255,0.5)';
                        if (col === 8) cell.style.borderRight = '2px solid rgba(255,255,255,0.5)';
                        
                        cell.addEventListener('click', (e) => this.selectCell(row, col));
                        boardElement.appendChild(cell);
                        this.cells.push(cell);
                    }
                }
            }
            
            newGame() {
                this.generatePuzzle();
                this.renderBoard();
            }
            
            generatePuzzle() {
                // Create a solved board first
                this.solveSudoku(Array(9).fill().map(() => Array(9).fill(0)), this.solution);
                
                // Copy to initial board
                for (let row = 0; row < 9; row++) {
                    for (let col = 0; col < 9; col++) {
                        this.initialBoard[row][col] = this.solution[row][col];
                    }
                }
                
                // Remove numbers based on difficulty
                const cellsToRemove = this.difficulty === 'easy' ? 35 : this.difficulty === 'medium' ? 45 : 55;
                
                for (let i = 0; i < cellsToRemove; i++) {
                    const row = Math.floor(Math.random() * 9);
                    const col = Math.floor(Math.random() * 9);
                    
                    if (this.initialBoard[row][col] !== 0) {
                        this.initialBoard[row][col] = 0;
                    } else {
                        i--; // Try again if already empty
                    }
                }
                
                // Copy to current board
                for (let row = 0; row < 9; row++) {
                    for (let col = 0; col < 9; col++) {
                        this.board[row][col] = this.initialBoard[row][col];
                    }
                }
            }
            
            solveSudoku(grid, solution) {
                // Simple backtracking solver
                for (let row = 0; row < 9; row++) {
                    for (let col = 0; col < 9; col++) {
                        if (grid[row][col] === 0) {
                            for (let num = 1; num <= 9; num++) {
                                if (this.isValidMove(grid, row, col, num)) {
                                    grid[row][col] = num;
                                    
                                    if (this.solveSudoku(grid, solution)) {
                                        return true;
                                    }
                                    
                                    grid[row][col] = 0;
                                }
                            }
                            return false;
                        }
                    }
                }
                return true;
            }
            
            isValidMove(board, row, col, num) {
                // Check row
                for (let x = 0; x < 9; x++) {
                    if (board[row][x] === num) return false;
                }
                
                // Check column
                for (let x = 0; x < 9; x++) {
                    if (board[x][col] === num) return false;
                }
                
                // Check 3x3 box
                const startRow = row - row % 3;
                const startCol = col - col % 3;
                
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        if (board[i + startRow][j + startCol] === num) return false;
                    }
                }
                
                return true;
            }
            
            renderBoard() {
                for (let row = 0; row < 9; row++) {
                    for (let col = 0; col < 9; col++) {
                        const cell = this.cells[row * 9 + col];
                        const value = this.board[row][col];
                        
                        cell.textContent = value !== 0 ? value : '';
                        
                        if (this.initialBoard[row][col] !== 0) {
                            cell.classList.add('fixed');
                            cell.style.color = '#333';
                        } else {
                            cell.classList.remove('fixed');
                            cell.style.color = 'white';
                        }
                        
                        cell.classList.remove('error');
                    }
                }
            }
            
            selectCell(row, col) {
                // Deselect previous cell
                if (this.selectedCell) {
                    const prevCell = this.cells[this.selectedCell[0] * 9 + this.selectedCell[1]];
                    prevCell.classList.remove('selected');
                }
                
                // Select new cell if it's not fixed
                if (this.initialBoard[row][col] === 0) {
                    this.selectedCell = [row, col];
                    const cell = this.cells[row * 9 + col];
                    cell.classList.add('selected');
                }
            }
            
            inputNumber(num) {
                if (!this.selectedCell) return;
                
                const [row, col] = this.selectedCell;
                
                if (this.initialBoard[row][col] === 0) {
                    this.board[row][col] = num;
                    this.renderBoard();
                    this.validateCell(row, col);
                }
            }
            
            validateCell(row, col) {
                const cell = this.cells[row * 9 + col];
                const num = this.board[row][col];
                
                if (num !== 0 && !this.isValidMove(this.board, row, col, num)) {
                    cell.classList.add('error');
                } else {
                    cell.classList.remove('error');
                }
            }
            
            checkSolution() {
                for (let row = 0; row < 9; row++) {
                    for (let col = 0; col < 9; col++) {
                        if (this.board[row][col] !== this.solution[row][col]) {
                            alert('Not quite right yet! Keep trying.');
                            return false;
                        }
                    }
                }
                
                alert('Congratulations! Puzzle solved correctly!');
                return true;
            }
            
            solvePuzzle() {
                for (let row = 0; row < 9; row++) {
                    for (let col = 0; col < 9; col++) {
                        this.board[row][col] = this.solution[row][col];
                    }
                }
                this.renderBoard();
            }
        }
        
        let game;
        
        function initGame() {
            game = new SudokuGame();
        }
        
        function inputNumber(num) {
            if (num === 0) {
                game.inputNumber(0); // Clear
            } else {
                game.inputNumber(num);
            }
        }
        
        function checkSolution() {
            game.checkSolution();
        }
        
        function newGame() {
            const difficulty = document.getElementById('difficulty').value;
            game.difficulty = difficulty;
            game.newGame();
        }
        
        function solvePuzzle() {
            game.solvePuzzle();
        }
        
        // Initialize the game
        window.onload = initGame;
    </script>
</body>
</html>
